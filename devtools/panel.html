<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="toolbar">
    <input id="filter" placeholder="Filter by URL, method, or status…" />
    <label class="check"><input type="checkbox" id="xhrOnly" checked /> XHR/Fetch only</label>
    <button id="clear" class="btn">Clear</button>
  </div>
  <div class="split">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Method</th><th>Status</th><th class="url">URL</th><th>Type</th><th>Time</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="detail" class="detail hidden">
      <div class="detail-bar">
        <button id="copyCurl" class="btn">Copy as cURL</button>
        <button id="copyFetch" class="btn">Copy as fetch</button>
        <button id="replay" class="btn">Replay in page</button>
        <button id="closeDetail" class="btn">✕</button>
      </div>
      <pre id="detailBody"></pre>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
