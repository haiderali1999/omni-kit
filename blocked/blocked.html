<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Blocked — Focus Mode</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1b1e26, #232733);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8eaf0;
    }
    .card {
      text-align: center;
      padding: 48px;
      max-width: 440px;
    }
    .emoji { font-size: 64px; }
    h1 { margin: 16px 0 8px; font-size: 24px; }
    p { color: #9aa0b0; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🧘</div>
    <h1>This site is blocked</h1>
    <p>Focus mode is on. This site is on your blocklist — get back to what matters.
       You can turn focus mode off from the OmniKit popup.</p>
  </div>
</body>
</html>
